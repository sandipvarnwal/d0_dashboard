<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>D0 DASHBOARD</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      margin: 10px; 
      background-color: #f4f6f8; 
      color: #333;
    }

    .header-bar { margin-bottom: 12px; }
    .header-title { font-size: 18px; font-weight: 700; color: #1a73e8; margin: 0 0 10px 0; }
    
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn { 
      padding: 8px 14px; 
      cursor: pointer; 
      border: 1px solid #ccc; 
      background: #ffffff; 
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .tab-btn.active { 
      background: #1a73e8; 
      border-color: #1a73e8; 
      color: #ffffff; 
    }

    .table-container { 
      width: 100%; 
      max-height: 80vh; 
      overflow-x: auto; 
      overflow-y: auto;
      border: 2px solid #555; 
      border-radius: 6px;
      background: #ffffff; 
      display: none; 
      position: relative;
      -webkit-overflow-scrolling: touch;
    }
    .table-container.active { display: block; }

    table { 
      border-collapse: separate; 
      border-spacing: 0; 
      table-layout: fixed !important;
    }
    
    td, th { 
      border-right: 1px solid #666666 !important; 
      border-bottom: 1px solid #666666 !important; 
      padding: 6px 8px !important; 
      font-size: 11px; 
      line-height: 1.35;
      white-space: normal !important; 
      word-wrap: break-word !important; 
      overflow-wrap: break-word !important; 
      overflow: visible !important; 
      vertical-align: middle;
      position: relative;
    }

    .freeze-row { position: sticky; z-index: 10; }
    .freeze-col { position: sticky; z-index: 10; }
    .freeze-row.freeze-col { z-index: 20; }

    /* FILTER UI STYLES */
    .filter-btn {
      display: inline-block;
      margin-left: 4px;
      cursor: pointer;
      font-size: 10px;
      color: #1a73e8;
      background: #e8f0fe;
      border: 1px solid #1a73e8;
      border-radius: 3px;
      padding: 1px 4px;
      vertical-align: middle;
    }
    .filter-btn.active-filter {
      background: #1a73e8;
      color: #ffffff;
    }

    .filter-popover {
      position: absolute;
      top: 100%;
      left: 0;
      width: 200px;
      background: #ffffff;
      border: 1px solid #999;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.25);
      z-index: 1000;
      padding: 8px;
      border-radius: 4px;
      display: none;
      font-weight: normal;
      text-align: left;
    }

    .filter-popover.show { display: block; }

    .filter-actions {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      gap: 4px;
    }

    .filter-actions button {
      font-size: 10px;
      padding: 3px 6px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #f8f9fa;
    }

    .sort-btn-group {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
    }
    .sort-btn-group button {
      flex: 1;
      font-size: 10px;
      padding: 4px;
      cursor: pointer;
      border: 1px solid #1a73e8;
      background: #ffffff;
      color: #1a73e8;
      border-radius: 3px;
    }

    .filter-search {
      width: 100%;
      font-size: 11px;
      padding: 4px;
      margin-bottom: 6px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    .filter-list {
      max-height: 140px;
      overflow-y: auto;
      border: 1px solid #eee;
      padding: 4px;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      margin-bottom: 3px;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1 class="header-title">D0 DASHBOARD</h1>
    <div class="tabs" id="tab-container"></div>
  </div>

  <div id="tables-wrapper"></div>

  <script>
    var activeFilters = {}; 

    function cleanId(str) {
      return str.replace(/[^a-zA-Z0-9]/g, '_');
    }

    function switchTab(cleanSheetId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.table-container').forEach(tc => tc.classList.remove('active'));
      
      const targetBtn = document.getElementById('btn-' + cleanSheetId);
      const targetContainer = document.getElementById('container-' + cleanSheetId);
      
      if (targetBtn) targetBtn.classList.add('active');
      if (targetContainer) targetContainer.classList.add('active');
    }

    // Close popovers on click outside
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.filter-popover') && !e.target.closest('.filter-btn')) {
        document.querySelectorAll('.filter-popover').forEach(p => p.classList.remove('show'));
      }
    });

    async function loadDashboard() {
      try {
        const response = await fetch('./data.json?t=' + new Date().getTime());
        const allData = await response.json();
        
        const tabContainer = document.getElementById('tab-container');
        const tablesWrapper = document.getElementById('tables-wrapper');
        tabContainer.innerHTML = '';
        tablesWrapper.innerHTML = '';

        let isFirst = true;

        for (const [sheetName, data] of Object.entries(allData)) {
          const safeId = cleanId(sheetName);
          const tabLabel = (data && data.meta && data.meta.displayName) ? data.meta.displayName : sheetName;

          const btn = document.createElement('button');
          btn.className = 'tab-btn' + (isFirst ? ' active' : '');
          btn.id = 'btn-' + safeId;
          btn.textContent = tabLabel;
          btn.onclick = () => switchTab(safeId);
          tabContainer.appendChild(btn);

          const container = document.createElement('div');
          container.className = 'table-container' + (isFirst ? ' active' : '');
          container.id = 'container-' + safeId;
          
          const table = document.createElement('table');
          table.id = 'table-' + safeId;

          const frozenRows = (data && data.meta && data.meta.frozenRows) ? data.meta.frozenRows : 0;
          const frozenCols = (data && data.meta && data.meta.frozenCols) ? data.meta.frozenCols : 0;
          const colWidths = (data && data.meta && data.meta.columnWidths) ? data.meta.columnWidths : [];
          const customRowHeights = (data && data.meta && data.meta.rowHeights) ? data.meta.rowHeights : {};

          activeFilters[safeId] = {};

          if (data && data.rows && data.rows.length > 0) {
            let maxCols = 0;
            data.rows.forEach(r => { if(r.length > maxCols) maxCols = r.length; });

            let pixelWidths = [];
            let leftOffsets = [];
            let totalTableWidth = 0;

            for (let c = 0; c < maxCols; c++) {
              const charCount = colWidths[c] !== undefined ? colWidths[c] : 12;
              const px = Math.round(charCount * 10) + 30; 
              pixelWidths[c] = px;

              if (c < frozenCols) {
                leftOffsets[c] = totalTableWidth;
              }
              totalTableWidth += px;
            }

            table.style.width = `${totalTableWidth}px`;

            const colGroup = document.createElement('colgroup');
            for (let c = 0; c < maxCols; c++) {
              const col = document.createElement('col');
              col.style.width = `${pixelWidths[c]}px`;
              colGroup.appendChild(col);
            }
            table.appendChild(colGroup);

            let topRowOffsets = [];
            let currentTopOffset = 0;

            data.rows.forEach((row, rIndex) => {
              const tr = document.createElement('tr');
              tr.dataset.rowIndex = rIndex;
              
              const sheetRowNumber = rIndex + 1;
              const rowHeight = customRowHeights[sheetRowNumber] ? customRowHeights[sheetRowNumber] : 32;
              
              tr.style.height = `${rowHeight}px`;
              topRowOffsets[rIndex] = currentTopOffset;
              currentTopOffset += rowHeight;

              row.forEach((cell, cIndex) => {
                if (cell.isCovered) return;

                const td = document.createElement('td');
                let cellVal = cell.value !== undefined ? String(cell.value) : '';
                td.dataset.colIndex = cIndex;
                td.dataset.rawVal = cellVal;

                if (cell.rowSpan && cell.rowSpan > 1) td.rowSpan = cell.rowSpan;
                if (cell.colSpan && cell.colSpan > 1) td.colSpan = cell.colSpan;

                if (!cell.colSpan || cell.colSpan === 1) {
                  td.style.width = `${pixelWidths[cIndex]}px`;
                  td.style.minWidth = `${pixelWidths[cIndex]}px`;
                }

                td.style.backgroundColor = (cell.bg && cell.bg !== '') ? cell.bg : '#ffffff';
                if (cell.color && cell.color !== '') td.style.color = cell.color;
                if (cell.bold) td.style.fontWeight = 'bold';

                if (rIndex < frozenRows) { 
                  td.classList.add('freeze-row'); 
                  td.style.top = `${topRowOffsets[rIndex]}px`; 
                }
                if (cIndex < frozenCols) { 
                  td.classList.add('freeze-col'); 
                  td.style.left = `${leftOffsets[cIndex]}px`; 
                }

                // Append text content
                const textSpan = document.createElement('span');
                textSpan.textContent = cellVal.replace(/_/g, '_ ');
                td.appendChild(textSpan);

                // Attach Filter UI to frozen header row
                if (rIndex === (frozenRows > 0 ? frozenRows - 1 : 0)) {
                  attachFilterUI(td, safeId, cIndex, data.rows, frozenRows);
                }

                tr.appendChild(td);
              });
              table.appendChild(tr);
            });
          }
          
          container.appendChild(table);
          tablesWrapper.appendChild(container);
          isFirst = false;
        }
      } catch (err) {
        console.error('Error loading dashboard data:', err);
      }
    }

    function attachFilterUI(td, sheetId, colIndex, allRows, frozenRows) {
      const filterBtn = document.createElement('span');
      filterBtn.className = 'filter-btn';
      filterBtn.innerHTML = '▼';
      filterBtn.title = 'Filter / Sort';

      const popover = document.createElement('div');
      popover.className = 'filter-popover';

      // Gather Unique Column Values (skipping headers)
      let rawValues = [];
      for (let r = frozenRows; r < allRows.length; r++) {
        if (allRows[r][colIndex] && !allRows[r][colIndex].isCovered) {
          let val = String(allRows[r][colIndex].value || '').trim();
          if (val !== '') rawValues.push(val);
        }
      }
      let uniqueValues = Array.from(new Set(rawValues)).sort();

      popover.innerHTML = `
        <div class="sort-btn-group">
          <button onclick="sortTable('${sheetId}', ${colIndex}, 'ASC')">Smallest → Largest</button>
          <button onclick="sortTable('${sheetId}', ${colIndex}, 'DESC')">Largest → Smallest</button>
        </div>
        <div class="filter-actions">
          <button onclick="selectAllFilters('${sheetId}', ${colIndex}, true)">Select All</button>
          <button onclick="selectAllFilters('${sheetId}', ${colIndex}, false)">Clear All</button>
        </div>
        <input type="text" class="filter-search" placeholder="Search..." oninput="searchFilterList(this)">
        <div class="filter-list" id="flist-${sheetId}-${colIndex}">
          ${uniqueValues.map(v => `
            <label class="filter-item">
              <input type="checkbox" value="${v}" checked onchange="applyColumnFilter('${sheetId}', ${colIndex})">
              <span>${v}</span>
            </label>
          `).join('')}
        </div>
      `;

      filterBtn.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.filter-popover').forEach(p => {
          if (p !== popover) p.classList.remove('show');
        });
        popover.classList.toggle('show');
      };

      td.appendChild(filterBtn);
      td.appendChild(popover);
    }

    function searchFilterList(input) {
      const filter = input.value.toLowerCase();
      const items = input.nextElementSibling.querySelectorAll('.filter-item');
      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(filter) ? 'flex' : 'none';
      });
    }

    function selectAllFilters(sheetId, colIndex, isSelectAll) {
      const container = document.getElementById(`flist-${sheetId}-${colIndex}`);
      container.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = isSelectAll);
      applyColumnFilter(sheetId, colIndex);
    }

    function applyColumnFilter(sheetId, colIndex) {
      const container = document.getElementById(`flist-${sheetId}-${colIndex}`);
      const checkedVals = Array.from(container.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
      const totalVals = container.querySelectorAll('input[type="checkbox"]').length;

      if (checkedVals.length < totalVals) {
        activeFilters[sheetId][colIndex] = checkedVals;
      } else {
        delete activeFilters[sheetId][colIndex];
      }

      // Update Filter Button Style
      const table = document.getElementById('table-' + sheetId);
      const th = table.querySelector(`td[data-col-index="${colIndex}"] .filter-btn`);
      if (th) {
        if (activeFilters[sheetId][colIndex]) th.classList.add('active-filter');
        else th.classList.remove('active-filter');
      }

      // Filter Rows
      const rows = table.querySelectorAll('tr');
      rows.forEach(row => {
        const rIdx = parseInt(row.dataset.rowIndex, 10);
        if (isNaN(rIdx)) return;

        let show = true;
        for (const [cIdx, allowedVals] of Object.entries(activeFilters[sheetId])) {
          const cell = row.querySelector(`td[data-col-index="${cIdx}"]`);
          if (cell) {
            const cellVal = (cell.dataset.rawVal || '').trim();
            if (!allowedVals.includes(cellVal) && cellVal !== '') {
              show = false;
              break;
            }
          }
        }
        row.style.display = show ? '' : 'none';
      });
    }

    function sortTable(sheetId, colIndex, direction) {
      const table = document.getElementById('table-' + sheetId);
      const tbody = table;
      const rows = Array.from(table.querySelectorAll('tr')).filter(r => r.dataset.rowIndex !== undefined);
      
      const frozenRowsCount = parseInt(rows[0].querySelector('td').dataset.rowIndex || 0, 10);

      const headerRows = rows.slice(0, frozenRowsCount + 1);
      const dataRows = rows.slice(frozenRowsCount + 1);

      dataRows.sort((a, b) => {
        const cellA = a.querySelector(`td[data-col-index="${colIndex}"]`);
        const cellB = b.querySelector(`td[data-col-index="${colIndex}"]`);

        let valA = cellA ? cellA.dataset.rawVal.trim() : '';
        let valB = cellB ? cellB.dataset.rawVal.trim() : '';

        // Numeric Sorting Detection
        let numA = parseFloat(valA.replace(/[^0-9.-]+/g, ""));
        let numB = parseFloat(valB.replace(/[^0-9.-]+/g, ""));

        if (!isNaN(numA) && !isNaN(numB)) {
          return direction === 'ASC' ? numA - numB : numB - numA;
        }

        // String Sorting
        return direction === 'ASC' ? valA.localeCompare(valB) : valB.localeCompare(valA);
      });

      // Re-append rows in sorted order
      dataRows.forEach(row => tbody.appendChild(row));
    }

    loadDashboard();
  </script>
</body>
</html>
